[package]
name = "wt_event_handler"
version = "0.1.2"
edition = "2021"
rust-version = "1.74"
license-file = "LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Optimized for decent speed yet good compile times
[profile.dev]
opt-level = 0
debug-assertions = true
overflow-checks = true
lto = false
incremental = true
codegen-units = 256

# I prefer having overflow checks, as it is crucial to validate integers even in production
[profile.release]
lto = true
opt-level = 3
debug = true
debug-assertions = false
overflow-checks = true

[dependencies]
scraper = "0.29"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
serenity = "0.12"
serde = "1.0"
serde_json = "1.0"
chrono = "0.4"
lazy_static = "1.5"
thiserror = "2.0"
rand = "0.10.3"

tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["tracing-log", "env-filter", "fmt", "std"] }
humantime = "2.1"
uptime_kuma_pusher = { git = "https://github.com/FlareFlo/uptime_kuma_pusher.git" }
